name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Ubuntu / Node 22.13.0 minimum
            os: ubuntu-latest
            node: "22.13.0"
          - label: Ubuntu / Node 26.0.0 current
            os: ubuntu-latest
            node: "26.0.0"
          - label: Windows / Node 22.13.0 minimum
            os: windows-latest
            node: "22.13.0"
          - label: macOS / Node 26.0.0 current
            os: macos-latest
            node: "26.0.0"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Audit production dependencies
        if: runner.os == 'Linux' && matrix.node == '22.13.0'
        run: pnpm audit --prod

      - name: Scan public source
        run: pnpm run scan:public
